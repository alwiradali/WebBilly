<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Break Rota — rolling loop</title>
  <link rel="icon" href="/favicon.ico?v=4" sizes="any">
  <style>
    :root{
      --bg:#060b1a; --card:rgba(255,255,255,.045); --border:rgba(120,180,255,.16);
      --text:#eaf2ff; --muted:#93a4c4; --accent:#38bdf8;
      --a:#60a5fa; --b:#f472b6; --c:#34d399;
      --grad-btn:linear-gradient(100deg,#1d6ff5,#0ea5e9 50%,#0891b2);
      --sans:'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:
      radial-gradient(900px 500px at 50% -10%, rgba(43,127,255,.22), transparent 60%),
      linear-gradient(160deg,#060b1a,#0a1226);
      color:var(--text);font-family:var(--sans);padding:24px 16px 60px}
    .wrap{max-width:1100px;margin:0 auto}
    h1{font-size:1.5rem;margin:0 0 4px}
    h2{font-size:1.05rem;margin:0 0 12px}
    p.sub{color:var(--muted);font-size:.92rem;margin:0 0 22px;line-height:1.5}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:18px}
    .grid{display:grid;gap:14px}
    .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
    @media (max-width:760px){.g3,.g4{grid-template-columns:1fr 1fr}}
    @media (max-width:480px){.g3{grid-template-columns:1fr}}
    label{display:block;font-size:.78rem;color:var(--muted);margin:0 0 5px;letter-spacing:.02em}
    input,select{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--border);
      background:rgba(0,0,0,.25);color:var(--text);font:inherit;font-size:.9rem}
    .group h3{margin:0 0 10px;font-size:.95rem;display:flex;align-items:center;gap:8px}
    .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
    .group input{margin-bottom:7px}
    .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
    button{border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer;
      background:var(--grad-btn);color:#fff}
    button.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
    .scroll{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:640px}
    th,td{padding:10px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
    th{color:var(--muted);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
    td.time{white-space:nowrap;font-weight:600}
    .chip{display:inline-block;padding:3px 9px;border-radius:999px;margin:2px 3px 2px 0;font-size:.82rem;
      border:1px solid currentColor;white-space:nowrap}
    .chip{color:var(--accent)}
    .loop{font-size:.95rem;font-weight:600;margin:0 0 18px;line-height:1.7}
    .loop span{white-space:nowrap}
    textarea{width:100%;min-height:290px;padding:9px 11px;border-radius:9px;border:1px solid var(--border);
      background:rgba(0,0,0,.25);color:var(--text);font:inherit;font-size:.9rem;line-height:1.55;resize:vertical}
    .st{display:grid;grid-template-columns:1fr 80px;gap:8px;margin-bottom:8px}
    .moves{font-size:.8rem;color:var(--muted);line-height:1.5;white-space:nowrap}
    .moves b{color:var(--text);font-weight:600}
    .two{display:grid;grid-template-columns:1fr 2fr;gap:18px}
    @media (max-width:760px){.two{grid-template-columns:1fr}}
    .brk{background:rgba(255,255,255,.06)}
    .note{font-size:.82rem;color:var(--muted);margin-top:10px;line-height:1.5}
    .ok{color:#34d399} .bad{color:#f87171}
    @media print{
      body{background:#fff;color:#000;padding:0}
      .no-print{display:none!important}
      .card{border:1px solid #bbb;background:#fff}
      th,td{border-color:#ccc}
      th,.note,p.sub{color:#333}
      .chip{border-color:#666}
      .chip{color:#000}
      .moves{color:#333}
      .brk{background:#eee}
    }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Break Rota</h1>
  <p class="sub">A rolling loop. Every changeover, the person (or two) who has been longest at each station moves on
    to the next one, so everyone works through every station in order and nobody skips one.</p>
  <p class="loop" id="loop"></p>

  <div class="card no-print">
    <div class="two">
      <div>
        <h2>People</h2>
        <label for="names">One name per line, in starting order round the loop</label>
        <textarea id="names" spellcheck="false"></textarea>
      </div>
      <div>
        <h2>Stations (in loop order, break last)</h2>
        <div id="stations"></div>
        <div class="grid g3" style="margin-top:14px">
          <div><label for="start">Start time</label><input type="time" id="start" value="09:00"></div>
          <div><label for="slot">Change every (minutes)</label><input type="number" id="slot" min="5" step="5" value="20"></div>
          <div><label for="brk">Break length (minutes)</label><input type="number" id="brk" min="5" step="5" value="40"></div>
          <div><label for="loops">Rounds of the loop</label>
            <select id="loops">
              <option value="1" selected>1 round (1 break each)</option>
              <option value="2">2 rounds (2 breaks each)</option>
              <option value="3">3 rounds (3 breaks each)</option>
            </select></div>
        </div>
      </div>
    </div>
    <div class="btns">
      <button id="build">Build rota</button>
      <button class="ghost" id="print">Print</button>
      <button class="ghost" id="reset">Reset</button>
    </div>
  </div>

  <div class="card">
    <h2>Rota by time</h2>
    <div class="scroll"><table id="rota"></table></div>
    <div class="note" id="check"></div>
  </div>

  <div class="card">
    <h2>Each person's day</h2>
    <div class="scroll"><table id="people"></table></div>
  </div>
</div>

<script>
(function(){
  const KEY = 'break-rota-v4';
  const DEFAULT_NAMES = ['Jake Snailham','Anju Kaliyadan','Stephen Curran','Georgel Oancea',
    'Zane Mcgrann','Michal Piskorz','AJ Kennedy','Jelty Jacob',
    'Anthony Fitzimons','Shibu Koshy','Robert Horton','Sreedith Chandrasekharan'];
  const DEFAULT_STATIONS = [
    {name:'Position 1', n:2}, {name:'Position 2', n:2}, {name:'Position 3', n:3},
    {name:'Stillage', n:2}, {name:'Break', n:3}
  ];

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function defaults(){
    return {names: DEFAULT_NAMES.slice(), stations: DEFAULT_STATIONS.map(x => ({...x})),
      start:'09:00', slot:20, brk:40, loops:1};
  }
  function load(){
    try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.names && s.stations) return s; } catch(e){}
    return defaults();
  }
  function save(s){ try { localStorage.setItem(KEY, JSON.stringify(s)); } catch(e){} }

  function renderInputs(s){
    $('names').value = s.names.join('\n');
    $('stations').innerHTML = s.stations.map((st, i) =>
      '<div class="st"><input data-s="'+i+'" value="'+esc(st.name)+'" aria-label="Station '+(i+1)+' name">' +
      '<input type="number" min="1" data-n="'+i+'" value="'+st.n+'" aria-label="People at station '+(i+1)+'"></div>').join('');
    $('start').value = s.start; $('slot').value = s.slot; $('brk').value = s.brk; $('loops').value = s.loops;
  }

  function readInputs(){
    const s = defaults();
    s.names = $('names').value.split('\n').map(x => x.trim()).filter(Boolean);
    document.querySelectorAll('#stations [data-s]').forEach(el => {
      const i = +el.dataset.s;
      s.stations[i].name = el.value.trim() || DEFAULT_STATIONS[i].name;
    });
    document.querySelectorAll('#stations [data-n]').forEach(el => {
      s.stations[+el.dataset.n].n = Math.max(1, parseInt(el.value, 10) || 1);
    });
    s.start = $('start').value || '09:00';
    s.slot = Math.max(5, parseInt($('slot').value, 10) || 20);
    s.brk = Math.max(s.slot, parseInt($('brk').value, 10) || 40);
    s.loops = parseInt($('loops').value, 10);
    return s;
  }

  // Everyone sits on one ring of seats laid out in loop order. Each
  // changeover the whole ring turns by k seats, which is the same as the k
  // longest-serving people at every station moving on to the next one. k is
  // chosen so the break station empties exactly once per break length: 3 on
  // break for 40 minutes with 20-minute changes gives k = 2, 1, 2, 1, ...
  // As long as k never exceeds the smallest station, nobody skips a station.
  function build(s){
    const total = s.stations.reduce((n, st) => n + st.n, 0);
    if (s.names.length !== total)
      return {error: 'The stations hold ' + total + ' people but there are ' + s.names.length + ' names.'};
    if (s.brk % s.slot)
      return {error: 'Break length must be a whole number of changeovers (' + s.slot + ' min each).'};
    const perBreak = s.brk / s.slot;
    const brkN = s.stations[s.stations.length - 1].n;
    const shift = t => Math.floor((t + 1) * brkN / perBreak) - Math.floor(t * brkN / perBreak);
    const smallest = Math.min(...s.stations.map(st => st.n));
    if (Math.ceil(brkN / perBreak) > smallest)
      return {error: 'Too many people move at once for the smallest station. Use a longer break or shorter changes.'};

    const seatStation = [];
    s.stations.forEach((st, i) => { for (let j = 0; j < st.n; j++) seatStation.push(i); });
    const slotsPerLoop = total / brkN * perBreak;
    const n = slotsPerLoop * s.loops;

    // seatOf[p] = seat index of person p; person p starts in seat p.
    let seatOf = s.names.map((_, p) => p);
    const slots = [];
    for (let t = 0; t < n; t++){
      if (t > 0){ const k = shift(t - 1); seatOf = seatOf.map(x => (x + k) % total); }
      const at = s.stations.map(() => []);
      // Longest-serving first: the higher the seat within a station, the
      // sooner that person moves on.
      seatOf.map((seat, p) => ({seat, p})).sort((a, b) => b.seat - a.seat)
        .forEach(({seat, p}) => at[seatStation[seat]].push(p));
      slots.push({at, station: seatOf.map(x => seatStation[x])});
    }
    return {slots, slotsPerLoop};
  }

  function fmt(mins){
    mins = ((mins % 1440) + 1440) % 1440;
    return String(Math.floor(mins/60)).padStart(2,'0') + ':' + String(mins%60).padStart(2,'0');
  }
  function slotTime(s, r){
    const [h,m] = s.start.split(':').map(Number);
    const t = h*60 + m + r*s.slot;
    return fmt(t) + '–' + fmt(t + s.slot);
  }
  const chip = (s, p) => '<span class="chip">'+esc(s.names[p])+'</span>';
  // First name only where space is tight, full name on hover.
  const short = (s, p) => '<span class="chip" title="'+esc(s.names[p])+'">'+esc(s.names[p].split(' ')[0])+'</span>';

  function render(s){
    $('loop').innerHTML = s.stations.map(st => '<span>'+esc(st.name)+' ('+st.n+')</span>').join(' → ') +
      ' → <span>'+esc(s.stations[0].name)+'</span>';
    const res = build(s);
    if (res.error){ $('rota').innerHTML = ''; $('people').innerHTML = ''; $('check').innerHTML = '<span class="bad">'+esc(res.error)+'</span>'; return; }
    const {slots, slotsPerLoop} = res;
    const B = s.stations.length - 1;

    let h = '<thead><tr><th>Time</th>' + s.stations.map(st => '<th>'+esc(st.name)+'</th>').join('') +
      '<th>Moving in</th></tr></thead><tbody>';
    slots.forEach((sl, r) => {
      let moves = '';
      if (r > 0){
        const prev = slots[r - 1].station;
        moves = s.stations.map((stn, i) => {
          const who = sl.at[i].filter(p => prev[p] !== i).map(p => esc(s.names[p].split(' ')[0]));
          return who.length ? '<b>' + esc(stn.name) + ':</b> ' + who.join(', ') : '';
        }).filter(Boolean).join('<br>');
      }
      h += '<tr><td class="time">'+slotTime(s, r)+'</td>' +
        sl.at.map((ps, i) => '<td'+(i === B ? ' class="brk"' : '')+'>' + ps.map(p => short(s, p)).join('') + '</td>').join('') +
        '<td class="moves">'+(moves || 'Start')+'</td></tr>';
    });
    $('rota').innerHTML = h + '</tbody>';

    // Per person: their station each slot, and checks that the order is kept
    // and that every break is the full length.
    let inOrder = true, fullBreaks = true;
    const brkSlots = s.brk / s.slot;
    let ph = '<thead><tr><th>Person</th>' + slots.map((_, r) => '<th>'+slotTime(s, r)+'</th>').join('') + '</tr></thead><tbody>';
    s.names.forEach((_, p) => {
      ph += '<tr><td>'+chip(s, p)+'</td>';
      let run = 0;
      slots.forEach((sl, r) => {
        const st = sl.station[p];
        if (r > 0){
          const was = slots[r - 1].station[p];
          if (st !== was && st !== (was + 1) % s.stations.length) inOrder = false;
        }
        if (st === B) run++;
        else { if (run && run !== brkSlots && r - run > 0) fullBreaks = false; run = 0; }
        ph += '<td'+(st === B ? ' class="brk"' : '')+'>'+esc(s.stations[st].name)+'</td>';
      });
      ph += '</tr>';
    });
    $('people').innerHTML = ph + '</tbody>';

    const mins = slotsPerLoop * s.slot;
    $('check').innerHTML =
      (inOrder ? '<span class="ok">✓ Everyone goes round in order and never skips a station.</span>'
               : '<span class="bad">✗ Someone skips a station.</span>') + ' ' +
      (fullBreaks ? '<span class="ok">✓ Every break is '+s.brk+' minutes.</span>'
                  : '<span class="bad">✗ Some breaks are cut short.</span>') +
      ' One round of the loop takes ' + Math.floor(mins/60) + 'h' + String(mins%60).padStart(2,'0') + '.' +
      ' Because the loop is already turning at the start, anyone on break at the very start or end gets' +
      ' the rest of that break at the other end of the rota.';
  }

  let state = load();
  renderInputs(state);
  render(state);

  $('build').addEventListener('click', () => { state = readInputs(); save(state); render(state); });
  $('print').addEventListener('click', () => window.print());
  $('reset').addEventListener('click', () => { state = defaults(); save(state); renderInputs(state); render(state); });
})();
</script>
</body>
</html>
