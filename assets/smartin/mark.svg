<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 132" role="img" aria-label="SMARTin Science">
  <defs>
    <linearGradient id="brain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#308fac"/>
      <stop offset="1" stop-color="#0457ac"/>
    </linearGradient>
    <linearGradient id="ring1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#37bd79"/>
      <stop offset="1" stop-color="#a7e237"/>
    </linearGradient>
    <linearGradient id="ring2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#308fac"/>
      <stop offset="1" stop-color="#37bd79"/>
    </linearGradient>
  </defs>

  <!-- orbiting rings: the "science" half of the mark -->
  <g fill="none" stroke-width="3.4" stroke-linecap="round">
    <ellipse cx="66" cy="66" rx="58" ry="25" stroke="url(#ring1)" opacity=".9" transform="rotate(-27 66 66)"/>
    <ellipse cx="66" cy="66" rx="58" ry="25" stroke="url(#ring2)" opacity=".75" transform="rotate(27 66 66)"/>
  </g>

  <!-- cartoon brain -->
  <g>
    <path d="M66 30c-6.6-8.2-20.4-7.4-23.8 1.6-8.6 1-13 8.6-9.6 15.8-4.4 5.8-1.4 14.4 5.8 16.6 0 8.6 8.6 13.4 16.8 10.2 3.4 7.2 12.6 8.4 16.4 2.6"
          fill="url(#brain)"/>
    <path d="M66 30c6.6-8.2 20.4-7.4 23.8 1.6 8.6 1 13 8.6 9.6 15.8 4.4 5.8 1.4 14.4-5.8 16.6 0 8.6-8.6 13.4-16.8 10.2-3.4 7.2-12.6 8.4-16.4 2.6"
          fill="url(#brain)"/>
    <path d="M66 30v47" stroke="#EAF4FB" stroke-width="2.6" stroke-linecap="round" opacity=".55"/>
    <g fill="none" stroke="#EAF4FB" stroke-width="2.4" stroke-linecap="round" opacity=".62">
      <path d="M55 38c-5 1-7 5-5 9s7 4 8 8"/>
      <path d="M44 52c4-1 8 1 9 5"/>
      <path d="M77 38c5 1 7 5 5 9s-7 4-8 8"/>
      <path d="M88 52c-4-1-8 1-9 5"/>
    </g>
  </g>

  <!-- test tube on the lower orbit -->
  <g transform="rotate(28 30 92)">
    <path d="M24.6 79v17.6a5.9 5.9 0 0 0 11.8 0V79" fill="#fff" stroke="#0457ac" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M25.9 89.4h9.2v7.2a4.6 4.6 0 0 1-9.2 0z" fill="#37bd79"/>
    <path d="M22.4 79h16.2" stroke="#0457ac" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="30.6" cy="85.6" r="1.7" fill="#a7e237"/>
  </g>

  <!-- orbiting atoms -->
  <circle cx="106" cy="90" r="6.4" fill="#ffba53"/>
  <circle cx="112" cy="38" r="4.4" fill="#37bd79"/>
  <circle cx="20" cy="44" r="3.6" fill="#a7e237"/>
</svg>
