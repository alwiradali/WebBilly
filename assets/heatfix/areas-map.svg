  <g>
    <!-- A legend, not a caption. The section heading directly above the map
         already says "Manchester, Stockport and the areas we cover"; repeating
         it inside the picture reads as a mistake and wastes the panel. This
         says what the marks mean, which nothing else on the page does. -->
    <text x="52" y="188" class="cap">THE PATCH</text>
    <circle cx="61" cy="234" r="7" class="d3"/>
    <text x="82" y="240" class="lg">Manchester &amp; Stockport</text>
    <circle cx="61" cy="278" r="5" class="d2"/>
    <text x="82" y="284" class="lg">Every area we cover</text>
    <path d="M52 320h20" stroke="#EF5B18" stroke-width="2.5" stroke-dasharray="9 7"/>
    <text x="82" y="326" class="lg">How far we come</text>
    <rect x="52" y="366" width="54" height="4" rx="2" fill="#EF5B18"/>
    <text x="52" y="410" class="sub">Every one a short drive, which</text>
    <text x="52" y="432" class="sub">is what makes same-day</text>
    <text x="52" y="454" class="sub">call-outs possible.</text>
