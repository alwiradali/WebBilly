<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="mt md">
  <title id="mt">The area HeatFix Mcr Limited covers</title>
  <desc id="md">A map of south Manchester, Trafford and Stockport with 64 towns marked, from Prestwich and Salford in the north down through Chorlton, Didsbury and the Heatons to Handforth and Bramhall in the south, and from Altrincham and Timperley in the west across to Romiley and Hazel Grove in the east.</desc>
  <style>
    .l1{font:500 15px Inter,system-ui,sans-serif;fill:#41536c}
    .l2{font:700 17px Montserrat,Inter,system-ui,sans-serif;fill:#0B2E63}
    .d1{fill:#3E93D0;opacity:.55}
    .d2{fill:#3E93D0}
    .d3{fill:#EF5B18;stroke:#fff;stroke-width:2.5}
    .cap{font:800 13px Montserrat,Inter,sans-serif;fill:#0B2E63;letter-spacing:.18em}
    .sub{font:500 15px Inter,system-ui,sans-serif;fill:#5f6e82}
    .lg{font:600 17px Inter,system-ui,sans-serif;fill:#2c3e57}
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8fd"/><stop offset="1" stop-color="#e3ecf7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0" stop-color="#EF5B18" stop-opacity=".13"/>
      <stop offset="1" stop-color="#EF5B18" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0v44" fill="none" stroke="#0B2E63" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1100" height="560" fill="url(#g)"/>
  <rect width="1100" height="560" fill="url(#grid)"/>
  <ellipse cx="729" cy="282" rx="462" ry="291" fill="url(#glow)"/>

