<title>Izzy's — Order · Sweet &amp; Coffee</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--cream:#f4f1ea;--ink:#201c17;--dark:#1a1714;--yellow:#e9c24a;--muted:#8c8377;--line:rgba(32,28,23,.12);
 --serif:'Fraunces',Georgia,serif;--sans:'Jost',system-ui,sans-serif;--ease:cubic-bezier(.5,1,.4,1)}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
.wrap{max-width:1320px;margin:0 auto;padding:0 3vw}
/* nav */
.nav{display:flex;align-items:center;justify-content:space-between;padding:22px 3vw;position:relative;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:600;font-size:1.3rem}
.logo .m{width:38px;height:38px;border-radius:50%;background:var(--ink);display:grid;place-items:center}
.logo .m svg{width:20px;height:20px;stroke:var(--yellow);fill:none;stroke-width:1.6}
.nlinks{display:flex;gap:34px;position:absolute;left:50%;transform:translateX(-50%)}
.nlinks a{color:var(--ink);text-decoration:none;font-size:.9rem;font-weight:500;opacity:.85}.nlinks a:hover{opacity:1}
.nact{display:flex;gap:10px;align-items:center}
.nact .si{background:none;border:0;font-family:var(--sans);font-weight:500;font-size:.85rem;color:var(--ink);padding:10px 16px;border-radius:40px;cursor:pointer}
.nact .li{background:var(--yellow);border:0;font-family:var(--sans);font-weight:600;font-size:.85rem;color:#23200f;padding:10px 20px;border-radius:40px;cursor:pointer}

/* hero */
.hero{position:relative;min-height:calc(100vh - 84px);overflow:hidden}
.panel{position:absolute;top:0;right:0;bottom:0;width:58%;background:radial-gradient(120% 120% at 70% 30%,#2a251f,#141110);clip-path:polygon(20% 0,100% 0,100% 100%,0 100%);z-index:1}
.panel .rings{position:absolute;inset:0;background:repeating-radial-gradient(circle at 62% 46%,transparent 0 38px,rgba(233,194,74,.05) 38px 39px)}
.hin{position:relative;z-index:3;max-width:1320px;margin:0 auto;padding:2vh 3vw 0;min-height:calc(100vh - 84px);display:grid;grid-template-columns:44% 56%;align-items:center}
/* left */
.eyebrow{font-family:var(--serif);font-style:italic;font-weight:400;font-size:1.5rem;color:var(--muted)}
.htitle{font-family:var(--serif);font-weight:600;font-size:clamp(2.2rem,4vw,3.5rem);line-height:1.05;margin:8px 0 0;max-width:14ch}
.hdesc{color:var(--muted);font-size:.95rem;line-height:1.6;margin-top:16px;max-width:40ch}
.price{font-family:var(--serif);font-weight:600;font-size:2.4rem;display:inline-block;margin:24px 26px 0 0;vertical-align:middle}
.buy{display:inline-flex;align-items:center;gap:9px;background:var(--yellow);color:#23200f;border:0;font-family:var(--sans);font-weight:600;font-size:.95rem;padding:14px 26px;border-radius:40px;cursor:pointer;vertical-align:middle;transition:transform .3s var(--ease),box-shadow .3s}
.buy:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(233,194,74,.45)}
.buy svg{width:16px;height:16px;stroke:#23200f;fill:none;stroke-width:1.7}
.chef{display:flex;align-items:center;gap:12px;margin-top:54px}
.chef .ci{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center}
.chef .ci svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.4}
.chef b{font-family:var(--serif);font-weight:500;font-size:.95rem;display:block}.chef span{font-size:.8rem;color:var(--muted)}
.doily{position:absolute;left:-40px;bottom:-40px;width:200px;height:200px;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 6px,rgba(32,28,23,.05) 6px 7px);z-index:0}

/* right dish */
.stage{position:relative;height:100%;display:grid;place-items:center}
.dish{position:relative;width:min(38vw,480px);aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:0 50px 90px -30px rgba(0,0,0,.7);z-index:3}
.dish img{width:100%;height:100%;object-fit:cover;animation:spin 34s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dish.swap img{transition:none}
.dish::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 60px rgba(0,0,0,.35)}
.inset{position:absolute;left:2%;bottom:8%;width:120px;height:120px;border-radius:50%;overflow:hidden;border:5px solid var(--cream);z-index:4;box-shadow:0 20px 40px rgba(0,0,0,.4)}
.inset img{width:100%;height:100%;object-fit:cover}
.swapf{transition:opacity .45s var(--ease),transform .45s var(--ease)}
.swapping .swapf-out{opacity:0;transform:translateY(10px)}
/* coupons */
.coupon{position:absolute;right:3vw;bottom:5vh;z-index:5;width:min(400px,42vw);background:rgba(20,17,14,.72);backdrop-filter:blur(8px);border:1px solid rgba(233,194,74,.2);border-radius:16px;padding:18px 20px;color:#efe7d6}
.coupon .ch{display:flex;justify-content:space-between;align-items:center;border-bottom:1px dotted rgba(239,231,214,.28);padding-bottom:12px;margin-bottom:12px}
.coupon .ch b{font-family:var(--serif);font-weight:500;font-size:1rem}
.coupon .nav2{display:flex;gap:14px;font-size:.72rem;color:#cbb9a0}.coupon .nav2 button{background:none;border:0;color:#cbb9a0;cursor:pointer;font-family:var(--sans);letter-spacing:.05em}
.coupon .nav2 button:hover{color:var(--yellow)}
.crow{display:flex;align-items:center;gap:14px}
.crow .ct{width:52px;height:52px;border-radius:50%;overflow:hidden;flex:0 0 auto}.crow .ct img{width:100%;height:100%;object-fit:cover}
.crow .cn b{font-family:var(--serif);font-weight:500;font-size:1.15rem;display:block;line-height:1.1}
.crow .cn span{font-size:.72rem;color:#cbb9a0}
.crow .cp{margin-left:auto;text-align:right}.crow .cp b{font-family:var(--serif);font-weight:600;font-size:1.4rem;color:var(--yellow);display:block}
.crow .cp button{margin-top:4px;background:var(--yellow);border:0;color:#23200f;font-family:var(--sans);font-weight:600;font-size:.68rem;padding:6px 12px;border-radius:30px;cursor:pointer}
/* dots */
.dots{position:absolute;left:44%;bottom:5vh;transform:translateX(-50%);display:flex;gap:8px;z-index:6}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(32,28,23,.2);cursor:pointer;transition:.3s}.dots i.on{background:var(--yellow);width:22px;border-radius:6px}

@media(max-width:900px){
 .nlinks{display:none}
 .hin{grid-template-columns:1fr;padding-top:2vh}
 .panel{width:100%;height:52%;top:auto;bottom:0;clip-path:polygon(0 12%,100% 0,100% 100%,0 100%)}
 .hero{min-height:auto}
 .left-col{padding-top:24px;text-align:center}
 .htitle,.hdesc{margin-left:auto;margin-right:auto}
 .stage{height:52vh;margin-top:10px}.dish{width:64vw}
 .chef{justify-content:center;margin-top:30px}
 .coupon{position:static;width:auto;margin:20px 3vw 0}
 .dots{position:static;transform:none;justify-content:center;margin:18px 0}
 .doily{display:none}
}
</style></head>

  ];
  var i=0,timer,reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  var $=function(id){return document.getElementById(id);};
  var els={eye:$('eyebrow'),title:$('title'),desc:$('desc'),price:$('price'),name:$('cName'),cprice:$('cPrice'),cal:$('cCal'),dishImg:$('dishImg'),cThumb:$('cThumb'),inset:$('inset').firstElementChild,dish:$('dish')};
  var swf=[els.eye,els.title,els.desc,els.price,els.name,els.cprice];
  var dots=$('dots');P.forEach(function(_,k){var d=document.createElement('i');if(!k)d.className='on';d.addEventListener('click',function(){go(k,1);});dots.appendChild(d);});
  var dotEls=[].slice.call(dots.children);
  function render(){var p=P[i];
    swf.forEach(function(e){e.classList.add('swapf-out');});
    els.dish.classList.add('spinout');
    setTimeout(function(){
      els.eye.innerHTML=p.eye;els.title.innerHTML=p.title;els.desc.innerHTML=p.desc;els.price.innerHTML=p.price;
      els.name.innerHTML=p.name;els.cprice.innerHTML=p.price;els.cal.textContent=p.cal;
      els.dishImg.src=p.img;els.cThumb.src=p.img;els.inset.src=p.inset;
      swf.forEach(function(e){e.classList.remove('swapf-out');});els.dish.classList.remove('spinout');
    },420);
    dotEls.forEach(function(d,k){d.classList.toggle('on',k===i);});
  }
  function go(n,manual){i=(n+P.length)%P.length;render();if(manual)restart();}
  function restart(){if(timer)clearInterval(timer);if(!reduce)timer=setInterval(function(){go(i+1,0);},3400);}
  document.getElementById('next').addEventListener('click',function(){go(i+1,1);});
  document.getElementById('prev').addEventListener('click',function(){go(i-1,1);});
  document.querySelector('.hero').addEventListener('mouseenter',function(){if(timer)clearInterval(timer);});
  document.querySelector('.hero').addEventListener('mouseleave',restart);
  restart();
})();
</script>
<style>
.hero .swapf{transition:opacity .42s var(--ease),transform .42s var(--ease)}
.hero .swapf-out{opacity:0;transform:translateY(12px)}
.dish{transition:transform .45s var(--ease),opacity .45s var(--ease)}
.dish.spinout{opacity:0;transform:scale(.86) rotate(-12deg)}
</style>
