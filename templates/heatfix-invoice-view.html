<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Your invoice · HeatFix Mcr Limited</title>
<meta property="og:image" content="https://heatfixmcrlimited.co.uk/assets/heatfix/og-card.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="HeatFix Mcr Limited — installation, servicing, repairs, heating, plumbing and gas safety across Greater Manchester.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://heatfixmcrlimited.co.uk/assets/heatfix/og-card.jpg">
<link rel="icon" href="/assets/heatfix/icon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&family=Playfair+Display:wght@500;600&display=swap">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:#e9edf3;color:#101c30;
       font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
       -webkit-font-smoothing:antialiased}

  .bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;
       padding:10px 16px;background:#0b2e63;color:#eaf2ff}
  .bar img{height:32px;width:auto;display:block}
  .bar .sp{flex:1}
  .bar button{min-height:40px;padding:0 15px;border:1px solid rgba(255,255,255,.26);
              border-radius:8px;background:rgba(255,255,255,.1);color:#eaf2ff;
              font:600 14px Inter,sans-serif;cursor:pointer}
  .bar button:hover{background:rgba(255,255,255,.2)}

  .wrap{max-width:834px;margin:0 auto;padding:20px 20px 60px}

  /* The sheet is A4 and stays A4; on a phone it is scaled down whole so
     nothing reflows and the customer sees the same document he signed off. */
  .sheetbox{overflow:hidden;border-radius:8px;box-shadow:0 18px 46px -20px rgba(15,28,48,.5)}
  .sheet{transform-origin:top left;width:794px}

  /* On screen the sheet stops where the invoice stops. The full A4 height
     is what a printer needs, not what a customer wants to scroll past. */
  @media screen{ .sheet .hfdoc{min-height:0} }

  .msg{padding:60px 24px;text-align:center;color:#5c6d85}
  .msg h1{font:600 21px/1.3 "Space Grotesk",Inter,sans-serif;color:#101c30;margin:0 0 8px}
  .msg a{color:#123f85}

  .after{margin:20px 0 0;padding:18px 20px;background:#fff;border:1px solid #dde4ee;
         border-radius:10px}
  .after h2{margin:0 0 4px;font:600 16px/1.3 "Space Grotesk",Inter,sans-serif}
  .after p{margin:0 0 14px;font-size:14px;color:#5c6d85}
  .after .row{display:flex;flex-wrap:wrap;gap:10px}
  .after a{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;
           border-radius:8px;font-weight:600;font-size:14.5px;text-decoration:none;
           background:#eef2f8;color:#101c30;border:1px solid #dde4ee}
  .after a.call{background:#ef5b18;color:#fff;border-color:#ef5b18}

  /* Photos of the work. They sit under the sheet rather than inside it: the
     invoice is a fixed A4 document that has to keep its shape when printed,
     and a variable number of photographs is not something A4 can absorb. */
  .shots{margin:20px 0 0;padding:18px 20px;background:#fff;border:1px solid #dde4ee;
         border-radius:10px}
  .shots h2{margin:0 0 4px;font:600 16px/1.3 "Space Grotesk",Inter,sans-serif}
  .shots p.sub{margin:0 0 14px;font-size:14px;color:#5c6d85}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .shot{margin:0;display:flex;flex-direction:column;gap:6px}
  .shot button{display:block;padding:0;border:1px solid #dde4ee;border-radius:8px;
               background:#eef2f8;cursor:zoom-in;overflow:hidden;line-height:0}
  .shot button:hover{border-color:#b9c6d8}
  .shot button:focus-visible{outline:3px solid #ef5b18;outline-offset:2px}
  .shot img{width:100%;height:150px;object-fit:cover;display:block}
  .shot figcaption{font-size:13px;color:#5c6d85;line-height:1.4}

  /* Tap to see it properly. A photo of a pipe run under a floor is no use at
     150 pixels square. */
  .lb{position:fixed;inset:0;z-index:50;display:none;align-items:center;
      justify-content:center;padding:20px;background:rgba(10,20,36,.92)}
  .lb[data-open]{display:flex}
  .lb img{max-width:100%;max-height:82vh;border-radius:6px;
          box-shadow:0 24px 60px -20px rgba(0,0,0,.7)}
  .lb figcaption{margin:12px 0 0;color:#dbe6f5;font-size:14px;text-align:center}
  .lb figure{margin:0;display:flex;flex-direction:column;align-items:center;max-width:1100px}
  .lb .x{position:absolute;top:14px;right:16px;min-height:44px;min-width:44px;
         border:1px solid rgba(255,255,255,.3);border-radius:8px;
         background:rgba(255,255,255,.12);color:#fff;font:600 15px Inter,sans-serif;
         cursor:pointer}
  .lb .x:hover{background:rgba(255,255,255,.24)}

  @media print{
    body{background:#fff}
    .bar,.after,.shots,.lb{display:none}
    .wrap{padding:0;max-width:none}
    /* fit() writes a measured pixel height onto .sheetbox so the scaled-down
       sheet does not leave a gap under it on screen. That measurement is taken
       against the COLLAPSED sheet (the screen rule below sets min-height:0),
       and print resets the scale back to 1:1 — so the box stayed at the screen
       height with overflow:hidden and guillotined the invoice. On a phone that
       left the customer with the top third of the page and no totals, no bank
       details and no Gas Safe number. Height and clipping both have to go. */
    .sheetbox{box-shadow:none;border-radius:0;
              height:auto!important;overflow:visible!important}
    .sheet{transform:none!important;width:794px}
    .sheet .hfdoc{min-height:1123px}
    @page{size:A4;margin:0}
  }
</style>
</head>
<body>

<div class="bar">
  <img src="/assets/heatfix/logo-lockup-rev-600.webp" alt="HeatFix Mcr Limited">
  <span class="sp"></span>
  <button id="print" hidden>Save as PDF</button>
</div>

<div class="wrap">
  <div id="host"><div class="msg"><h1>Loading your invoice…</h1></div></div>
  <section class="shots" id="shots" hidden>
    <h2 id="shotsTitle">Photos of the work</h2>
    <p class="sub">Tap any photo to see it full size.</p>
    <div class="grid" id="shotGrid"></div>
  </section>
  <div class="after" id="after" hidden>
    <h2>Any questions?</h2>
    <p>Give us a ring or send a message and we will sort it.</p>
    <div class="row" id="afterRow"></div>
  </div>
</div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo of the work">
  <button class="x" id="lbClose" aria-label="Close photo">Close</button>
  <figure><img id="lbImg" alt=""><figcaption id="lbCap"></figcaption></figure>
</div>

<script src="/assets/js/heatfix-qr.js"></script>
<script src="/assets/js/heatfix-invoice-templates.js"></script>
<script>
(function () {
  "use strict";
  var host = document.getElementById("host");
  var esc = window.HFInvoice.esc;

  /* /i/<uuid>, or ?id=<uuid> when opened from the preview host. */
  function invoiceId() {
    var m = /^\/i\/([0-9a-f-]{16,})$/i.exec(location.pathname);
    if (m) return m[1];
    return new URLSearchParams(location.search).get("id") || "";
  }

  function fail(title, detail) {
    host.innerHTML = '<div class="msg"><h1>' + esc(title) + "</h1><p>" + esc(detail) + "</p>" +
      '<p><a href="/">Go to the HeatFix website</a></p></div>';
  }

  /* The photos load lazily and are decoded off the main thread, so a job with
     a dozen of them does not hold up the invoice itself on a phone. */
  function drawPhotos(list) {
    if (!list.length) return;
    var grid = document.getElementById("shotGrid");
    document.getElementById("shotsTitle").textContent =
      list.length === 1 ? "Photo of the work" : "Photos of the work";

    grid.innerHTML = list.map(function (p, i) {
      var src = "/api/hf/photo/" + encodeURIComponent(p.id);
      var alt = p.caption ? esc(p.caption) : "Photo " + (i + 1) + " of the work carried out";
      return '<figure class="shot">' +
               '<button type="button" data-i="' + i + '" aria-label="Enlarge ' + alt + '">' +
                 '<img src="' + src + '" alt="' + alt + '" loading="lazy" decoding="async">' +
               "</button>" +
               (p.caption ? "<figcaption>" + esc(p.caption) + "</figcaption>" : "") +
             "</figure>";
    }).join("");

    document.getElementById("shots").hidden = false;

    var lb = document.getElementById("lb"),
        lbImg = document.getElementById("lbImg"),
        lbCap = document.getElementById("lbCap"),
        opener = null;

    function open(i) {
      var p = list[i];
      lbImg.src = "/api/hf/photo/" + encodeURIComponent(p.id);
      lbImg.alt = p.caption || "Photo " + (i + 1) + " of the work carried out";
      lbCap.textContent = p.caption || "";
      lb.setAttribute("data-open", "");
      document.getElementById("lbClose").focus();
    }
    function close() {
      lb.removeAttribute("data-open");
      lbImg.removeAttribute("src");
      /* Put the keyboard back where it was, not at the top of the page. */
      if (opener) opener.focus();
    }

    grid.addEventListener("click", function (e) {
      var btn = e.target.closest("button[data-i]");
      if (!btn) return;
      opener = btn;
      open(Number(btn.getAttribute("data-i")));
    });
    document.getElementById("lbClose").addEventListener("click", close);
    lb.addEventListener("click", function (e) { if (e.target === lb) close(); });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && lb.hasAttribute("data-open")) close();
    });
  }

  function fit() {
    var box = document.querySelector(".sheetbox"), sheet = document.querySelector(".sheet");
    if (!box || !sheet) return;
    var scale = Math.min(1, box.clientWidth / 794);
    sheet.style.transform = "scale(" + scale + ")";
    box.style.height = (sheet.scrollHeight * scale) + "px";
  }
  window.addEventListener("resize", fit);

  (async function () {
    var id = invoiceId();
    if (!id) { fail("No invoice here", "The link you followed is missing its invoice number."); return; }

    var data;
    try {
      var res = await fetch("/api/hf/public/" + encodeURIComponent(id));
      data = await res.json();
      if (!res.ok) throw new Error(data.error || "That invoice is not available.");
    } catch (e) {
      fail("We could not find that invoice", e.message + " If you were sent this link, give us a ring and we will resend it.");
      return;
    }

    var f = window.HFInvoice.fragment(data);
    var style = document.createElement("style");
    style.textContent = f.css;
    document.head.appendChild(style);
    host.innerHTML = '<div class="sheetbox"><div class="sheet">' + f.html + "</div></div>";

    document.title = "Invoice " + (data.invoice.number || "") + " · " +
      (data.business.name || "HeatFix Mcr Limited");
    document.getElementById("print").hidden = false;

    drawPhotos(data.photos || []);

    var b = data.business, row = document.getElementById("afterRow"), bits = [];
    if (b.phone) bits.push('<a class="call" href="tel:' + esc(String(b.phone).replace(/\s+/g, "")) + '">Ring ' + esc(b.phone) + "</a>");
    if (b.phone) bits.push('<a href="https://wa.me/' +
      esc(String(b.phone).replace(/[^0-9]/g, "").replace(/^0/, "44")) + '">WhatsApp</a>');
    if (b.email) bits.push('<a id="mailBtn" href="mailto:' + esc(b.email) +
      '?subject=' + encodeURIComponent("Invoice " + (data.invoice.number || "")) +
      '">Email</a>');
    if (bits.length) { row.innerHTML = bits.join(""); document.getElementById("after").hidden = false; }

    /* A mailto does nothing at all on a machine with no mail app set up, and
       the customer is left pressing a dead button. If we are still here a
       moment after the click, nothing handled it — so put the address on the
       clipboard and say so, which is what they needed anyway. */
    var mailBtn = document.getElementById("mailBtn");
    if (mailBtn) {
      mailBtn.addEventListener("click", function () {
        var addr = b.email;
        setTimeout(function () {
          if (document.hidden) return;              /* the mail app took over */
          function shown(msg) {
            mailBtn.textContent = msg;
            setTimeout(function () { mailBtn.textContent = "Email"; }, 2600);
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(addr).then(
              function () { shown("Copied " + addr); },
              function () { shown(addr); }
            );
          } else { shown(addr); }
        }, 700);
      });
    }

    /* Wait for the logo before measuring, or the sheet is sized short. */
    var imgs = Array.prototype.slice.call(host.querySelectorAll("img"));
    await Promise.all(imgs.map(function (im) {
      return im.complete ? null : new Promise(function (r) { im.onload = im.onerror = r; });
    }));
    fit();
    setTimeout(fit, 400);
  })();

  document.getElementById("print").addEventListener("click", function () { window.print(); });
})();
</script>
</body>
</html>
