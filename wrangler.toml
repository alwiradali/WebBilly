# Cloudflare Workers config for Billy Digitals.
# Serves the repository as static assets AND runs a small Worker that adds
# one API route (POST /api/send-review) for the review-request email.
name = "billydigitals"
compatibility_date = "2025-07-03"

# Worker entry point. Static assets are served by Cloudflare first; this
# Worker only runs for non-asset paths (i.e. /api/send-review).
main = "worker.js"

# NOTE: routes must be declared BEFORE the [assets] table — in TOML any keys
# after a [table] header belong to that table.
routes = [
  { pattern = "billydigitals.com", custom_domain = true },
  { pattern = "www.billydigitals.com", custom_domain = true }
  # Client sites on their own domains — uncomment and set the real hostname
  # once the domain's nameservers point at Cloudflare, then add the same
  # hostnames to M2L_HOST below.
  # ,{ pattern = "mumbai2london.co.uk", custom_domain = true }
  # ,{ pattern = "www.mumbai2london.co.uk", custom_domain = true }
  #
  # Megacity Properties. DO NOT UNCOMMENT THESE UNTIL megacityproperties.co.uk
  # is an Active zone in THIS Cloudflare account. A custom_domain route for a
  # zone the account does not hold makes `wrangler deploy` fail, and a failed
  # deploy freezes billydigitals.com and every other client site on this
  # Worker — the same way the placeholder D1 id did. Uncomment these two lines
  # and MEGACITY_HOST below in the SAME commit; check-wrangler.mjs fails the
  # build if one is set without the other.
  # ,{ pattern = "megacityproperties.co.uk", custom_domain = true }
  # ,{ pattern = "www.megacityproperties.co.uk", custom_domain = true }
]

[vars]
# Comma-separated hostnames that should serve ONLY the Mumbai2London site,
# at clean root URLs (/, /admin, /invoice, /sign) and indexable by Google.
# Leave empty and everything stays as it is on billydigitals.com.
M2L_HOST = ""

# Hostnames that serve ONLY the Megacity Properties site, at root addresses
# ("/lettings", "/let/<id>"), with the old site's addresses redirected and the
# domain's own robots.txt and sitemap. The FIRST hostname is canonical: every
# other one 301s to it. Empty means Megacity stays on the demo host only.
#
# Turn on together with the two Megacity routes above, not before — see the
# note there, and docs/megacity-golive.md.
# MEGACITY_HOST = "www.megacityproperties.co.uk,megacityproperties.co.uk"
MEGACITY_HOST = ""

# D1 database for Mumbai2London enquiries + booking diary.
# Create it once with:  npx wrangler d1 create m2l
# then paste the database_id it prints below, and run:
#   npx wrangler d1 execute m2l --remote --file=./migrations/0001_m2l.sql
# DISABLED: database_id below is a placeholder, not a real UUID, and Cloudflare
# rejects the whole deploy because of it. Every push since it was added has
# failed to reach billydigitals.com. worker.js already handles a missing
# binding (m2lDb() returns null and the endpoints answer connected:false), so
# leaving this commented out is safe.
# To turn the M2L booking diary on:
#   npx wrangler d1 create m2l
#   paste the real database_id below, uncomment the four lines, then
#   npx wrangler d1 execute m2l --remote --file=./migrations/0001_m2l.sql
# [[d1_databases]]
# binding = "M2L_DB"
# database_name = "m2l"
# database_id = "PASTE_REAL_ID_HERE"

[assets]
directory = "."
not_found_handling = "404-page"
# Lets the Worker fall through to static assets via env.ASSETS.fetch().
binding = "ASSETS"
# These paths must reach the Worker before the static-asset router.
#
# "/api/*" is not optional. With not_found_handling set, the asset router
# answers unmatched paths itself and never falls through to the Worker, so
# every /api/ endpoint was being served the static 404 page (405 on POST) —
# the quote form, the review emails and the whole Mumbai2London booking,
# chat, admin and invoice layer were dead in production because of it.
#
# The rest let a client domain serve its site at "/" instead of the Billy
# Digitals homepage. If wrangler is too old for the array form, use `true`.
# The preview aliases and the /vendor/ rewrite (PREVIEW_ALIASES in worker.js)
# are not assets, and with not_found_handling = "404-page" the asset router
# answers an unmatched path with the 404 page itself, never reaching the
# Worker, unless the path is listed here. Both capitalisations, because the
# address gets typed from a text message.
run_worker_first = ["/api/*", "/", "/admin", "/invoice", "/sign",
                    "/westfield", "/westfield/", "/Westfield", "/Westfield/", "/vendor/*"]

# ---------------------------------------------------------------------------
# Molecular Miracles on Lynsey's own Cloudflare account.
# Deploy with:  CLOUDFLARE_API_TOKEN=<token from HER account> \
#               npx wrangler deploy --env mm
#
# Unlike heatfix, this one does not serve the repository. scripts/build-mm.py
# produces a self-contained site in dist/molecular-miracles — rewritten paths,
# clean URLs, canonicals, a sitemap and its own _worker.js — so the Worker and
# the assets both come from there and nothing of any other client is reachable
# on her domain. Build before deploying, or you ship whatever was last built.
#
# Do NOT let this block go missing. Without it `--env mm` silently falls back
# to the top-level config: it deploys a worker called billydigitals-mm, serves
# the ENTIRE repository as its assets, and leaves her real site untouched on
# the worker below. That has happened once already.
#
# The name MUST match the Worker already serving her domain. Deploying under a
# different name creates a second Worker and quietly leaves her site on the old
# one, which looks like a deploy that did nothing.
[env.mm]
name = "muddy-pine-f5bb"
account_id = "d8e0c6635e2961e3c35061d28271846f"
main = "dist/molecular-miracles/_worker.js"
routes = [
  { pattern = "molecularmiracleschemistrytuition.co.uk", custom_domain = true },
  { pattern = "www.molecularmiracleschemistrytuition.co.uk", custom_domain = true }
]

[env.mm.assets]
directory = "dist/molecular-miracles"
# Her _worker.js calls env.ASSETS.fetch, so the binding has to carry that name.
binding = "ASSETS"
not_found_handling = "404-page"
# The Worker owns /api/mm-shop and hands everything else to the asset router,
# which is what resolves /daytime to daytime.html.
run_worker_first = false

# ---------------------------------------------------------------------------
# Rod Martin — SMARTin SCIENCE, on HIS OWN Cloudflare account.
#
# Same arrangement as Lynsey's: his account is not connected to this
# repository and does not need to be. A scoped API token travels one way,
# from his Cloudflare into GitHub Secrets, and is never written down here.
# account_id therefore comes from CLOUDFLARE_ACCOUNT_ID at deploy time rather
# than sitting in a public repo.
#
# Static only — no `main`. His site has no API of its own: the enquiry form
# posts straight to Web3Forms from the browser, so there is no Worker code to
# run and nothing server-side to get wrong.
#
# As with [env.mm], do not let this block go missing: `--env smartin` would
# then silently fall back to the top-level config and deploy the entire
# repository to his account under the wrong name, while his real site sat
# untouched somewhere else looking like a deploy that did nothing.
[env.smartin]
name = "smartin-science"
# His own entry script. Without this, wrangler inherits the top-level
# main = "worker.js" and deploys BILLYDIGITALS' worker to his account:
# every path that is not a page throws Cloudflare error 1101 instead of
# returning a 404, and that worker's API routes answer on his hostname.
# It happened. [env.mm] sets its own main and was never affected.
main = "dist/smartin-science/_worker.js"
routes = [
  { pattern = "smartinscience.co.uk", custom_domain = true },
  { pattern = "www.smartinscience.co.uk", custom_domain = true }
]

[env.smartin.assets]
directory = "dist/smartin-science"
# The build writes about.html and links to /about, so the server has to resolve
# the extensionless URL. This is wrangler's default, stated so it cannot drift.
html_handling = "auto-trailing-slash"

# binding is what creates env.ASSETS. Without it his Worker had no way to
# reach the files, so every path that was not already an asset threw and
# Cloudflare answered 1101 instead of 404. [env.mm.assets] has always had
# these three lines; this block never did.
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = false

# ---------------------------------------------------------------------------
# Westfield Garage Int Limited — Levenshulme, on HIS OWN Cloudflare account.
#
# Same arrangement as Rod's and Lynsey's: his account is not connected to this
# repository and does not need to be. A scoped API token travels one way, from
# his Cloudflare into GitHub Secrets, and is never written down here.
# account_id therefore comes from CLOUDFLARE_ACCOUNT_ID at deploy time rather
# than sitting in a public repo.
#
# His domain is deliberately NOT on the billydigitals Worker above. A push to
# any branch of this repository deploys that Worker to production (see
# PROJECT-NOTES.md), so a stray branch push would put the wrong tree on a
# client's live site. His own Worker in his own account cannot be reached that
# way at all.
#
# Static only — no `main`. The enquiry forms post straight to Web3Forms from
# the browser, so there is no Worker code to run and nothing server-side to
# get wrong.
#
# As with [env.mm] and [env.smartin], do not let this block go missing:
# `wrangler deploy --env westfield` would then silently fall back to the
# top-level config and upload the ENTIRE repository — every other client's
# files — into his Cloudflare account under the wrong worker name, while his
# real site sat untouched somewhere else looking like a deploy that did
# nothing. deploy-westfield.yml checks for it before every deploy.
[env.westfield]
# The Worker he created in his own dashboard on 14 Sep and attached both
# domains to. Workers cannot be renamed, so the config carries its name: a
# deploy with this env updates that Worker in place rather than creating a
# second one that could never bind the domains.
name = "noisy-forest-8b27"
routes = [
  { pattern = "westfieldgarageintlimited.co.uk", custom_domain = true },
  { pattern = "www.westfieldgarageintlimited.co.uk", custom_domain = true }
]

[env.westfield.assets]
directory = "dist/westfield-garage"
not_found_handling = "404-page"

# ---------------------------------------------------------------------------
# Megacity Properties — on WALID'S OWN Cloudflare account.
#
# The zone megacityproperties.co.uk lives in his account, which is the right
# way round: he owns the domain, the site, the database and the photographs,
# and can take them elsewhere one day without asking anybody. A Worker custom
# domain can only be created for a zone in the same account as the Worker, so
# the Worker is deployed there too — this block is how.
#
# As with [env.mm] and [env.smartin], do not let this block go missing.
# `wrangler deploy --env megacity` without it does NOT fail: it falls back to
# the top-level config and uploads the ENTIRE repository — every other client's
# pages, photographs and documents — into his account as static assets, and
# reports success. `directory` below points at dist/megacity precisely so there
# is nothing else there to send; scripts/build-megacity.mjs builds it from an
# allow-list and refuses to run if another client's name appears in a path.
#
# account_id is deliberately absent: it arrives as CLOUDFLARE_ACCOUNT_ID at
# deploy time from GitHub Secrets, so a client's account number is not written
# down in a public repository.
#
# TWO REPOSITORY SECRETS (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN_MEGACITY   from HIS Cloudflare, scoped to:
#                                     Account → Workers Scripts    → Edit
#                                     Account → D1                 → Edit
#                                     Account → Workers R2 Storage → Edit
#                                     Zone    → Workers Routes     → Edit
#                                   on megacityproperties.co.uk only.
#   CLOUDFLARE_ACCOUNT_ID_MEGACITY  his account ID, on the right of any page
#                                   in his Cloudflare dashboard.
[env.megacity]
name = "megacity-properties"
main = "worker.js"
# routes = [] IS NOT THE SAME AS NO routes LINE, and the difference is the
# agency's own website.
#
# An environment with no routes of its own INHERITS the top-level ones, which
# are billydigitals.com and www.billydigitals.com. wrangler says so plainly
# when you run it: "Deploying this environment will reassign these custom
# domains away from the top-level Worker." So `wrangler deploy --env megacity`
# with the routes merely commented out would have pointed the agency's live
# domain at a Worker in a client's account.
#
# An empty list inherits nothing. It is what keeps this deploy incapable of
# touching any domain at all, which is exactly right between the DNS move and
# the website move.
routes = []
#
# THE REAL ROUTES, for when his nameservers have moved and the zone reads
# Active in his account. Replace the line above with these two — a custom_domain
# route for a zone the account does not hold fails the deploy, so they cannot
# go in before then.
#
# routes = [
#   { pattern = "megacityproperties.co.uk", custom_domain = true },
#   { pattern = "www.megacityproperties.co.uk", custom_domain = true }
# ]

[env.megacity.vars]
# Root mode: the same pages served at root addresses on his domain, every old
# address redirected once, his own robots.txt and sitemap, branded 404. The
# first hostname is the one everything redirects to.
MEGACITY_HOST = "www.megacityproperties.co.uk,megacityproperties.co.uk"

[env.megacity.assets]
directory = "dist/megacity"
binding = "ASSETS"
not_found_handling = "404-page"
# Every request must reach the Worker first: on his domain the Worker owns the
# lot — pages at root, the old site's addresses redirected, the branded 404 and
# the Studio. Without this the asset router answers first and none of it works.
run_worker_first = true

# The database and the bucket are created in HIS account, once. Uncomment both
# blocks and paste the real database_id when they exist — scripts/check-wrangler.mjs
# fails the build while the placeholder is still there, so a deploy cannot go
# out half-wired.
#
#   npx wrangler d1 create megacity            (in his account)
#   npx wrangler r2 bucket create megacity-media
#   npx wrangler d1 migrations apply megacity --remote --env megacity
#
[[env.megacity.d1_databases]]
binding = "MEGACITY_DB"
database_name = "megacity"
# WITHOUT THIS, `wrangler d1 migrations apply --env megacity` reads the
# TOP-LEVEL migrations/ folder, which holds Mumbai2London's and Molecular
# Miracles' schemas. It does not fail: it applies them, reports success, and
# leaves the client's database holding another client's tables.
#
# That happened on 22 September, into Walid's database. The reason it is worth
# this many lines: both that folder and this one define a table called
# `enquiries`, with different columns, and both use CREATE TABLE IF NOT EXISTS.
# So the next run would have SKIPPED Megacity's enquiries table as "already
# there" and his site would have written viewing requests into a table shaped
# for event bookings — no error anywhere, just enquiries quietly failing.
migrations_dir = "migrations/megacity"
# Created in HIS account on 22 September, Western Europe. A database id is an
# identifier, not a credential — it is useless without a token for the account
# that holds it, which is why it can live here while the account id cannot.
database_id = "6b7c0475-b238-4949-ae07-b443f18a7a37"

[[env.megacity.r2_buckets]]
binding = "MEDIA"
bucket_name = "megacity-media"
