# Cloudflare Workers config for Billy Digitals.
# Serves the repository as static assets AND runs a small Worker that adds
# one API route (POST /api/send-review) for the review-request email.
name = "billydigitals"
compatibility_date = "2025-07-03"

# Worker entry point. Static assets are served by Cloudflare first; this
# Worker only runs for non-asset paths (i.e. /api/send-review).
main = "worker.js"

# NOTE: routes must be declared BEFORE the [assets] table — in TOML any keys
# after a [table] header belong to that table.
routes = [
  { pattern = "billydigitals.com", custom_domain = true },
  { pattern = "www.billydigitals.com", custom_domain = true }
  # Client sites on their own domains — uncomment and set the real hostname
  # once the domain's nameservers point at Cloudflare, then add the same
  # hostnames to M2L_HOST below.
  # ,{ pattern = "mumbai2london.co.uk", custom_domain = true }
  # ,{ pattern = "www.mumbai2london.co.uk", custom_domain = true }
]

[vars]
# Comma-separated hostnames that should serve ONLY the Mumbai2London site,
# at clean root URLs (/, /admin, /invoice, /sign) and indexable by Google.
# Leave empty and everything stays as it is on billydigitals.com.
M2L_HOST = ""

# D1 database for Mumbai2London enquiries + booking diary.
# Create it once with:  npx wrangler d1 create m2l
# then paste the database_id it prints below, and run:
#   npx wrangler d1 execute m2l --remote --file=./migrations/0001_m2l.sql
# DISABLED: database_id below is a placeholder, not a real UUID, and Cloudflare
# rejects the whole deploy because of it. Every push since it was added has
# failed to reach billydigitals.com. worker.js already handles a missing
# binding (m2lDb() returns null and the endpoints answer connected:false), so
# leaving this commented out is safe.
# To turn the M2L booking diary on:
#   npx wrangler d1 create m2l
#   paste the real database_id below, uncomment the four lines, then
#   npx wrangler d1 execute m2l --remote --file=./migrations/0001_m2l.sql
# [[d1_databases]]
# binding = "M2L_DB"
# database_name = "m2l"
# database_id = "PASTE_REAL_ID_HERE"

[assets]
directory = "."
not_found_handling = "404-page"
# Lets the Worker fall through to static assets via env.ASSETS.fetch().
binding = "ASSETS"
# These paths must reach the Worker before the static-asset router.
#
# "/api/*" is not optional. With not_found_handling set, the asset router
# answers unmatched paths itself and never falls through to the Worker, so
# every /api/ endpoint was being served the static 404 page (405 on POST) —
# the quote form, the review emails and the whole Mumbai2London booking,
# chat, admin and invoice layer were dead in production because of it.
#
# The rest let a client domain serve its site at "/" instead of the Billy
# Digitals homepage. If wrangler is too old for the array form, use `true`.
run_worker_first = ["/api/*", "/", "/admin", "/invoice", "/sign"]

# ---------------------------------------------------------------------------
# Molecular Miracles on Lynsey's own Cloudflare account.
# Deploy with:  CLOUDFLARE_API_TOKEN=<token from HER account> \
#               npx wrangler deploy --env mm
#
# Unlike heatfix, this one does not serve the repository. scripts/build-mm.py
# produces a self-contained site in dist/molecular-miracles — rewritten paths,
# clean URLs, canonicals, a sitemap and its own _worker.js — so the Worker and
# the assets both come from there and nothing of any other client is reachable
# on her domain. Build before deploying, or you ship whatever was last built.
#
# Do NOT let this block go missing. Without it `--env mm` silently falls back
# to the top-level config: it deploys a worker called billydigitals-mm, serves
# the ENTIRE repository as its assets, and leaves her real site untouched on
# the worker below. That has happened once already.
#
# The name MUST match the Worker already serving her domain. Deploying under a
# different name creates a second Worker and quietly leaves her site on the old
# one, which looks like a deploy that did nothing.
[env.mm]
name = "muddy-pine-f5bb"
account_id = "d8e0c6635e2961e3c35061d28271846f"
main = "dist/molecular-miracles/_worker.js"
routes = [
  { pattern = "molecularmiracleschemistrytuition.co.uk", custom_domain = true },
  { pattern = "www.molecularmiracleschemistrytuition.co.uk", custom_domain = true }
]

[env.mm.assets]
directory = "dist/molecular-miracles"
# Her _worker.js calls env.ASSETS.fetch, so the binding has to carry that name.
binding = "ASSETS"
not_found_handling = "404-page"
# The Worker owns /api/mm-shop and hands everything else to the asset router,
# which is what resolves /daytime to daytime.html.
run_worker_first = false

# ---------------------------------------------------------------------------
# Rod Martin — SMARTin SCIENCE, on HIS OWN Cloudflare account.
#
# Same arrangement as Lynsey's: his account is not connected to this
# repository and does not need to be. A scoped API token travels one way,
# from his Cloudflare into GitHub Secrets, and is never written down here.
# account_id therefore comes from CLOUDFLARE_ACCOUNT_ID at deploy time rather
# than sitting in a public repo.
#
# Static only — no `main`. His site has no API of its own: the enquiry form
# posts straight to Web3Forms from the browser, so there is no Worker code to
# run and nothing server-side to get wrong.
#
# As with [env.mm], do not let this block go missing: `--env smartin` would
# then silently fall back to the top-level config and deploy the entire
# repository to his account under the wrong name, while his real site sat
# untouched somewhere else looking like a deploy that did nothing.
[env.smartin]
name = "smartin-science"
routes = [
  { pattern = "smartinscience.co.uk", custom_domain = true },
  { pattern = "www.smartinscience.co.uk", custom_domain = true }
]

[env.smartin.assets]
directory = "dist/smartin-science"
# The build writes about.html and links to /about, so the server has to resolve
# the extensionless URL. This is wrangler's default, stated so it cannot drift.
html_handling = "auto-trailing-slash"
