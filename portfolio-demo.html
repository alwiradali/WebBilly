<title>Billy Digitals — Portfolio Slider Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#050506;--pane:#0a0a0c;--text:#f4f5f7;--muted:#8b8d95;--line:rgba(255,255,255,.14);
 --c2:#38bdf8;--disp:'Space Grotesk',Inter,sans-serif;--serif:'Playfair Display',Georgia,serif}
body{font-family:Inter,system-ui,sans-serif;background:#040405;color:var(--text);overflow-x:hidden}
.wrap{max-width:1280px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
 background:var(--bg);padding:34px 40px 26px}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;flex:0 0 auto}
.logo{font-family:var(--disp);font-weight:700;font-size:1.5rem;letter-spacing:-.02em}
.logo b{color:var(--c2)}
.tnav{display:flex;align-items:center;gap:22px}
.tnav .ask{color:var(--muted);font-size:.92rem}
.pill{font-family:var(--disp);font-weight:600;font-size:.9rem;color:#08090c;background:#fff;
 padding:11px 22px;border-radius:999px;text-decoration:none;transition:transform .3s,box-shadow .3s;white-space:nowrap}
.pill:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(255,255,255,.18)}
.tdiv{width:52px;height:1px;background:var(--line)}
.socs{display:flex;gap:14px}
.socs a{color:var(--muted);display:grid;place-items:center;transition:color .3s}
.socs a:hover{color:#fff}
.socs svg{width:18px;height:18px;fill:currentColor}
/* stage */
.stage{position:relative;flex:1 1 auto;margin:26px 0;min-height:0}
.strip{position:absolute;inset:0;overflow:hidden}
.sl{position:absolute;top:0;height:100%;overflow:hidden;border-radius:2px;cursor:pointer;
 will-change:transform,width,left;transition:left .8s cubic-bezier(.76,0,.24,1),width .8s cubic-bezier(.76,0,.24,1)}
.sl.na{transition:none!important}
.sl-img{position:absolute;inset:0;background-size:cover;background-position:center;
 transition:transform 1.1s cubic-bezier(.76,0,.24,1),filter .6s}
.sl-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,4,6,.05),rgba(4,4,6,.28));
 opacity:0;transition:opacity .6s}
.sl.side .sl-img{filter:brightness(.72) saturate(.9)}
.sl.side:hover .sl-img{filter:brightness(.92)}
.sl.active:hover .sl-scrim{opacity:1}
/* rotating badge */
.badge{position:absolute;right:2px;bottom:-30px;width:118px;height:118px;z-index:6;
 display:grid;place-items:center;text-decoration:none;color:#fff;pointer-events:auto}
.badge .ring{position:absolute;inset:0;width:100%;height:100%;animation:spin 14s linear infinite}
.badge .ring text{font-family:var(--disp);font-weight:600;font-size:9.2px;letter-spacing:1.1px;fill:#fff;text-transform:uppercase}
.badge .disc{width:60px;height:60px;border:1.4px solid rgba(255,255,255,.85);border-radius:50%;
 display:grid;place-items:center;background:rgba(6,6,8,.35);backdrop-filter:blur(2px);transition:transform .4s,background .4s}
.badge:hover .disc{transform:scale(1.08);background:rgba(255,255,255,.14)}
.badge .disc svg{width:16px;height:16px;fill:#fff;margin-left:2px}
@keyframes spin{to{transform:rotate(360deg)}}
/* bottom bar */
.bot{flex:0 0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;
 padding-top:20px;border-top:1px solid var(--line)}
.b-url{font-size:.9rem;color:var(--muted);font-family:var(--disp);letter-spacing:.01em}
.b-url a{color:var(--muted);text-decoration:none;transition:color .3s}.b-url a:hover{color:#fff}
.b-mid{text-align:center}
.b-name{font-family:var(--serif);font-weight:600;font-size:clamp(1.3rem,2.4vw,1.9rem);line-height:1.05}
.b-cat{font-family:var(--disp);font-weight:500;font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;
 color:var(--muted);margin-top:5px}
.b-count{justify-self:end;font-family:var(--serif);font-style:italic;font-size:1.05rem;color:var(--muted)}
.b-count b{color:#fff;font-style:normal;font-weight:600}
.swap{transition:opacity .38s,transform .38s}
.swap.out{opacity:0;transform:translateY(8px)}
/* progress dots */
.dots{position:absolute;left:0;bottom:-14px;display:flex;gap:7px}
.dots i{width:22px;height:2px;background:rgba(255,255,255,.2);border-radius:2px;cursor:pointer;transition:background .4s}
.dots i.on{background:#fff}
/* mobile */
@media (max-width:760px){
 .wrap{padding:20px 16px 18px;min-height:100vh}
 .logo{font-size:1.2rem}
 .tnav .ask,.tdiv,.socs{display:none}
 .pill{padding:9px 16px;font-size:.8rem}
 .stage{margin:20px 0;flex:0 0 auto;height:64vw}
 .sl{border-radius:10px}
 .badge{width:82px;height:82px;bottom:-16px;right:-4px}
 .badge .disc{width:44px;height:44px}
 .badge .ring text{font-size:8.4px}
 .bot{grid-template-columns:1fr;gap:2px;text-align:center;padding-top:16px}
 .b-url,.b-count{display:none}
 .b-cat{margin-top:3px}
 .dots{left:50%;transform:translateX(-50%)}
}
@media (prefers-reduced-motion:reduce){ .sl,.sl-img{transition:none} .ring{animation:none} }
</style></head>

 </div>

 <footer class="bot">
   <div class="b-url"><a id="fUrl" href="#" target="_blank" rel="noopener">limesharp.net</a></div>
   <div class="b-mid"><div class="b-name swap" id="fName">ATB Premier Travel</div><div class="b-cat swap" id="fCat">Travel Agency</div></div>
   <div class="b-count"><b id="fNum">01</b> / <span id="fTot">10</span></div>
 </footer>
</div>

<script>
(function(){
 var strip=document.getElementById('strip');
 var sls=[].slice.call(strip.querySelectorAll('.sl'));
 var N=sls.length, active=0, timer=null, DUR=3800;
 var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
 var fName=document.getElementById('fName'),fCat=document.getElementById('fCat'),
     fUrl=document.getElementById('fUrl'),fNum=document.getElementById('fNum'),
     badge=document.getElementById('badge');
 document.getElementById('fTot').textContent=('0'+N).slice(-2);
 // dots
 var dots=document.getElementById('dots');
 sls.forEach(function(_,i){var b=document.createElement('i');b.addEventListener('click',function(){go(i,1);});dots.appendChild(b);});
 var dotEls=[].slice.call(dots.children);

 function geom(){
   var W=strip.clientWidth, H=strip.clientHeight, mob=W<=760;
   var aw=mob? W*0.84 : Math.min(W*0.60, W-260);       // active panel width
   var la=(W-aw)/2;
   var g=Math.max(mob?10:12, W*0.016);
   var sw=Math.max(mob?14:18, la-g);                   // side strip fills the side region
   // desktop: panel fills full height. mobile: landscape card centred vertically
   var ph = mob? Math.min(H, aw*0.66) : H;
   var top= mob? (H-ph)/2 : 0;
   return {W:W,H:H,aw:aw,sw:sw,g:g,la:la,ph:ph,top:top,mob:mob};
 }
 function mod(n,m){return ((n%m)+m)%m;}

 function layout(animate){
   var G=geom();
   for(var k=0;k<N;k++){
     var o=k-active; if(o>N/2)o-=N; if(o<-N/2)o+=N;   // signed offset -N/2..N/2
     var el=sls[k], left, width=G.sw, on=true, side=true;
     el.style.height=G.ph+'px'; el.style.top=G.top+'px';
     if(o===0){ left=G.la; width=G.aw; side=false; }
     else if(o===1){ left=G.la+G.aw+G.g; }           // right strip, flush to right edge
     else if(o===-1){ left=0; }                       // left strip, flush to left edge
     else if(o===2){ left=G.W+G.g; }                  // off-stage right (enters next)
     else if(o===-2){ left=-G.g-G.sw; }               // off-stage left (exits)
     else { on=false; left=(o>0)?G.W+60:-G.sw-60; }
     // entering from parked -> place with no transition first
     var wasParked=el.__parked;
     if(!animate || (wasParked && on)){
       el.classList.add('na');
       el.style.left=left+'px'; el.style.width=width+'px';
       void el.offsetWidth;                 // reflow
       el.classList.remove('na');
     } else {
       el.style.left=left+'px'; el.style.width=width+'px';
     }
     el.style.display = on? 'block':'none';
     el.classList.toggle('side',side);
     el.classList.toggle('active',o===0);
     el.__parked = !on;
   }
 }

 function meta(){
   var el=sls[active];
   [fName,fCat].forEach(function(n){n.classList.add('out');});
   fUrl.parentNode;
   setTimeout(function(){
     fName.textContent=el.dataset.name;
     fCat.textContent=el.dataset.cat;
     fUrl.textContent=el.dataset.url;
     fUrl.href=el.dataset.href;
     badge.href=el.dataset.href;
     fNum.textContent=('0'+(active+1)).slice(-2);
     [fName,fCat].forEach(function(n){n.classList.remove('out');});
   },300);
   dotEls.forEach(function(d,i){d.classList.toggle('on',i===active);});
 }

 function go(i,manual){ active=mod(i,N); layout(true); meta(); if(manual)restart(); }
 function next(){ go(active+1,0); }
 function restart(){ if(timer)clearInterval(timer); if(!reduce)timer=setInterval(next,DUR); }

 // click slides
 sls.forEach(function(el,i){
   el.addEventListener('click',function(e){
     if(el.__drag)return;
     var o=i-active; if(o>N/2)o-=N; if(o<-N/2)o+=N;
     if(o===0){ window.open(el.dataset.href,'_blank'); }
     else { go(active+ (o>0?1:-1),1); }
   });
 });
 // drag / swipe
 var sx=0,dragging=false;
 strip.addEventListener('pointerdown',function(e){dragging=true;sx=e.clientX;sls.forEach(function(s){s.__drag=false;});});
 window.addEventListener('pointermove',function(e){ if(!dragging)return; if(Math.abs(e.clientX-sx)>6)sls.forEach(function(s){s.__drag=true;}); });
 window.addEventListener('pointerup',function(e){
   if(!dragging)return; dragging=false; var dx=e.clientX-sx;
   if(dx<-40)go(active+1,1); else if(dx>40)go(active-1,1);
 });
 // pause on hover
 strip.addEventListener('mouseenter',function(){if(timer)clearInterval(timer);});
 strip.addEventListener('mouseleave',restart);

 function boot(){ layout(false); meta(); restart(); }
 if(document.fonts&&document.fonts.ready) document.fonts.ready.then(boot); else boot();
 window.addEventListener('resize',function(){layout(false);});
 window.addEventListener('load',function(){layout(false);});
})();
</script>
</body></html>
