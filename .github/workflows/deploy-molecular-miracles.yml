# Molecular Miracles → Lynsey's Cloudflare Worker
#
# A push to main that touches her site rebuilds and redeploys it.
#
# There is deliberately NO schedule. It had one, on the theory that an hourly
# rebuild would pick up new products by itself. It cannot. Payhip sits behind
# Cloudflare and Cloudflare refuses datacentre networks — every one we tried,
# every way we tried it:
#
#   her own Cloudflare Worker   403 "Just a moment..."
#   GitHub runner, curl         403 on every header combination, API included
#   GitHub runner, real Chrome  403, still challenged after nine seconds
#
# So no server can read her shop, and an hourly job could only redeploy the
# same products indefinitely while reporting success — the worst kind of
# broken. The product list is fetched from an ordinary connection by
# scripts/mm-refresh-shop.sh and committed; that push is what publishes it.
#
# Deploys through the Cloudflare API with a token in GitHub Secrets. Her
# Cloudflare account is NOT connected to this repository and does not need to
# be — the token travels one way, from her account into a secret here.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#
#   CLOUDFLARE_API_TOKEN_MM  — from LYNSEY's Cloudflare account, with
#                              Account → Workers Scripts → Edit
#   CLOUDFLARE_ACCOUNT_ID_MM — d8e0c6635e2961e3c35061d28271846f
#
# Without them the job builds and checks but does not deploy, so a fork or a
# credential-less checkout does not show a red tick for something it was never
# meant to do.

name: Deploy Molecular Miracles

on:
  push:
    branches: [main]
    # Only what actually changes her site. Rebuilding hers because Rod's page
    # changed is noise that trains people to ignore the deploy history.
    paths:
      - 'templates/mm/**'
      - 'assets/mm/**'
      - 'assets/mm-brand/**'
      - 'scripts/build-mm.py'
      - 'wrangler.toml'
      - '.github/workflows/deploy-molecular-miracles.yml'
  workflow_dispatch:

concurrency:
  group: deploy-molecular-miracles
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          # Wrangler requires Node >= 22 and refuses to start below it, and
          # GitHub is deprecating Node 20 on the runners anyway.
          node-version: '22'

      - name: Build the site
        # Payhip refuses GitHub's runners, so this build always falls back to
        # the committed snapshot — that is expected here, not a fault. Say so
        # on the run summary either way, so nobody has to remember which it
        # was, and so the day Payhip does answer we find out.
        run: |
          set -o pipefail
          python3 scripts/build-mm.py molecularmiracleschemistrytuition.co.uk 2>&1 | tee build.log
          if grep -q 'could not reach the shop' build.log; then
            echo "::notice::Payhip refused this runner, as it always does — the shop was published from the committed snapshot. That is the normal path here; refresh it with scripts/mm-refresh-shop.sh."
          else
            echo "::notice::Product list read live from Payhip."
          fi

      - name: Check the build looks right
        # A deploy that succeeds having published an empty or half-built
        # directory is worse than one that fails, because nobody looks.
        run: |
          set -e
          test -f dist/molecular-miracles/index.html
          test -f dist/molecular-miracles/_worker.js
          test -f dist/molecular-miracles/sitemap.xml
          test -f dist/molecular-miracles/.assetsignore
          pages=$(find dist/molecular-miracles -name '*.html' | wc -l)
          echo "built $pages pages"
          test "$pages" -ge 20
          # No page may ship markup that routes customers to the Payhip
          # storefront — that was the whole complaint. The ONE permitted
          # mention is the escape hatch inside fallback(), which renders only
          # if the product feed itself fails: a working shop link beats a dead
          # page.
          #
          # That code now lives in shop.js rather than inline in each page, so
          # this counts it there. It caught a real regression on the way: a
          # standing "Open the shop →" link in the shop section's waiting
          # state, which every visitor would have seen on every load until the
          # feed answered. Four deploys failed here before anyone noticed the
          # site was not updating, so the check works — but see the step below,
          # which is what makes a failure visible instead of silent.
          if grep -rq 'href="https://payhip.com/molecularmiracles' dist/molecular-miracles/*.html; then
            echo "a page links out to the Payhip storefront in its markup"; exit 1
          fi
          for f in masterclasses resources; do
            n=$(grep -c 'payhip.com/molecularmiracles' "dist/molecular-miracles/$f.html" || true)
            echo "  $f.html: $n storefront reference(s)"
            if [ "$n" -gt 0 ]; then
              echo "$f.html routes customers to the storefront; only shop.js may, and only on feed failure"
              exit 1
            fi
          done
          n=$(grep -c 'payhip.com/molecularmiracles' dist/molecular-miracles/shop.js || true)
          echo "  shop.js: $n storefront reference(s)"
          if [ "$n" -ne 1 ]; then
            echo "shop.js should carry exactly one storefront link, the feed-failure fallback"; exit 1
          fi

      - name: Check wrangler will deploy to HER worker
        # Guard rail, learned the hard way. If [env.mm] is missing from
        # wrangler.toml, `wrangler deploy --env mm` does not fail — it falls
        # back to the top-level config, deploys a worker named
        # billydigitals-mm, uploads the ENTIRE repository (every other
        # client's files) to her Cloudflare account as static assets, and
        # leaves her real site untouched. It looks like a successful deploy.
        run: |
          set -e
          grep -q '^\[env\.mm\]' wrangler.toml
          grep -q '^name = "muddy-pine-f5bb"' wrangler.toml
          grep -q '^directory = "dist/molecular-miracles"' wrangler.toml
          echo "wrangler.toml targets muddy-pine-f5bb from dist/molecular-miracles"

      - name: Are the credentials present?
        id: creds
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN_MM }}" ] \
          && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID_MM }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare credentials not set — built and checked, but not deployed."
          fi

      - name: Deploy to her Cloudflare Worker
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_MM }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_MM }}
        # Judge the deploy on whether the Worker was actually uploaded, not on
        # wrangler's exit code.
        #
        # After a successful upload wrangler re-asserts the custom-domain
        # routes, which needs Zone -> Workers Routes on the token; this one has
        # Account -> Workers Scripts. Her domain is already bound to this
        # Worker and nothing needs changing, but wrangler still exits 1, which
        # painted a fully successful deploy red — and a red tick that means
        # "fine, actually" teaches you to ignore the real ones.
        #
        # So this greps for the upload line and fails if it is absent. That is
        # narrower than ignoring the exit code: a genuine failure never prints
        # it. Give the token that permission and this step goes back to being
        # an ordinary pass.
        run: |
          set -o pipefail
          npx --yes wrangler@latest deploy --env mm 2>&1 | tee deploy.log || true
          if grep -q 'Uploaded muddy-pine-f5bb' deploy.log; then
            echo "::notice::Worker uploaded to muddy-pine-f5bb."
            if grep -q 'workers/routes' deploy.log; then
              echo "::warning::Deploy succeeded. Wrangler could not re-assert the custom-domain routes (token lacks Zone -> Workers Routes); her domain is already bound, so nothing changed."
            fi
          else
            echo "::error::Wrangler did not upload the Worker."
            exit 1
          fi

      - name: Confirm the live site is actually THIS build
        if: steps.creds.outputs.ready == 'true'
        # A 200 only proves something is there — the site answered 200
        # throughout four consecutive failed deploys while serving a copy that
        # was days out of date. So this compares the live page against the one
        # just built: same shop script, same byte length. A stale deploy now
        # fails here instead of looking fine.
        run: |
          set -e
          SITE=https://molecularmiracleschemistrytuition.co.uk
          want=$(wc -c < dist/molecular-miracles/shop.js)
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE/" || true)
            echo "attempt $i: homepage $code"
            if [ "$code" = "200" ]; then
              n=$(curl -s "$SITE/api/mm-shop" \
                  | python3 -c 'import sys,json; print(len(json.load(sys.stdin).get("products",[])))' || echo 0)
              echo "shop feed is carrying $n products"
              # An empty shop is a broken shop — she always has products live.
              test "$n" -ge 1
              got=$(curl -s "$SITE/shop.js" | wc -c)
              echo "shop.js: built $want bytes, live $got bytes"
              if [ "$want" != "$got" ]; then
                echo "::error::The live site is not serving this build — shop.js differs."
                exit 1
              fi
              curl -s "$SITE/masterclasses" | grep -q 'shop.js'
              echo "::notice::Live site is serving this build."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Homepage did not return 200 after the deploy."
          exit 1
